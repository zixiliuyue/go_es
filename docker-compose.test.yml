# 容器化集成测试编排
# 与 docker-compose.yml(demo)隔离, 独立 project 名
# 通过 HOST_ES_PORT / HOST_GO_ES_PORT 暴露到本机

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ${PROJ:-go_es_test}_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${HOST_ES_PORT:-19200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [testnet]

  go_es_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: ${PROJ:-go_es_test}_go_es
    environment:
      - ES_ADDR=:9200                 # 自研服务端不需要 ES, 此处仅占位
      - ES_DATA=/data
    volumes:
      - go_es_data:/data
    ports:
      - "${HOST_GO_ES_PORT:-19201}:9200"
    healthcheck:
      # 通过业务端点探活, 不依赖 ES
      test: ["CMD", "wget", "-qO-", "http://localhost:9200/_health/liveness"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [testnet]

  tester:
    image: alpine:3.19
    container_name: ${PROJ:-go_es_test}_tester
    depends_on:
      es:
        condition: service_healthy
      go_es_server:
        condition: service_healthy
    environment:
      - ES_URL=http://es:9200
      - GO_ES_URL=http://go_es_server:9200
    volumes:
      - ./scripts/e2e-tests.sh:/e2e-tests.sh:ro
    entrypoint: ["sh", "/e2e-tests.sh"]
    networks: [testnet]

networks:
  testnet:
    driver: bridge

volumes:
  go_es_data:
